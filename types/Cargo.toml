[package]
name = "rsnano_types"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
banano = []

[dependencies]
rsnano_nullable_random = { path = "../nullables/random" }
rand = { version = "0.10.1" }
aes = "0"
blake2 = "0"
ctr = "0"
#ed25519-dalek = { git = "https://github.com/rsnano-node/ed25519-dalek.git", rev = "1f9d706d7033d34bdc1ed7c1789498c82ec0df10", features = ["legacy_compatibility", "rand_core"] }
ed25519-dalek = { git = "https://github.com/rsnano-node/curve25519-dalek.git", rev = "eb3b931ba16569f9cce8989cc1e6167d567018db", features = ["legacy_compatibility", "rand_core"] }
hex = "0"
num = "0"
num-traits = "0"
num-format = "0"
num-derive = "0"
primitive-types = "0"
rust-argon2 = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
static_assertions = "1"
chrono = "0"
strum = "0.27.2"
strum_macros = "0.27.2"
thiserror = "2.0.18"
const_format = "0.2.35"
