[package]
name = "rsnano_types"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
banano = []

[dependencies]
rsnano_nullable_random = { path = "../nullables/random" }
rand = { version = "0.10.1" }
aes = "0.9.1"
blake2 = "0.10.6"
ctr = "0.10.1"
#ed25519-dalek = { git = "https://github.com/rsnano-node/ed25519-dalek.git", rev = "1f9d706d7033d34bdc1ed7c1789498c82ec0df10", features = ["legacy_compatibility", "rand_core"] }
ed25519-dalek = { git = "https://github.com/rsnano-node/curve25519-dalek.git", rev = "eb3b931ba16569f9cce8989cc1e6167d567018db", features = ["legacy_compatibility", "rand_core"] }
hex = "0.4.3"
num = "0.4.3"
num-traits = "0.2.19"
num-format = "0.4.4"
num-derive = "0.4.2"
primitive-types = "0.14.0"
rust-argon2 = "3.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
static_assertions = "1.1"
chrono = "0.4.45"
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.18"
const_format = "0.2.36"
