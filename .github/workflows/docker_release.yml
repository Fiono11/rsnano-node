name: Docker Release

on:
  release:
    types: [published]

concurrency:
  group: docker-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build & Publish (${{ matrix.flavor }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: nano
            dockerfile: tools/scripts/docker/nano/Dockerfile
            images: |
              ghcr.io/rsnano-node/rsnano
              docker.io/rsnano/rsnano
          - flavor: banano
            dockerfile: tools/scripts/docker/banano/Dockerfile
            images: |
              ghcr.io/rsnano-node/rsban
              docker.io/rsnano/rsban
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.images }}
          # Versions are not semver (e.g. V29.0, V28.0RC1), so use the raw tag
          # name. `latest` is only applied to stable (non-prerelease) releases.
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.flavor }}-release
          cache-to: type=gha,scope=${{ matrix.flavor }}-release,mode=max
