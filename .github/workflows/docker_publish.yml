name: Docker Publish

on:
  push:
    branches: [develop]

concurrency:
  group: docker-publish-develop
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build & Publish (${{ matrix.flavor }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: nano
            dockerfile: tools/scripts/docker/nano/Dockerfile
            images: |
              ghcr.io/simpago/rsnano-dev
              docker.io/rsnano/rsnano-dev
          - flavor: banano
            dockerfile: tools/scripts/docker/banano/Dockerfile
            images: |
              ghcr.io/simpago/rsban-dev
              docker.io/rsnano/rsban-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.images }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.flavor }}
          cache-to: type=gha,scope=${{ matrix.flavor }},mode=max

  cleanup:
    name: Prune old SHA tags (${{ matrix.flavor }})
    needs: build-and-publish
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: nano
            ghcr_package: rsnano-dev
            dockerhub_repo: rsnano/rsnano-dev
          - flavor: banano
            ghcr_package: rsban-dev
            dockerhub_repo: rsnano/rsban-dev
    steps:
      - name: Delete old versions from ghcr.io
        uses: actions/delete-package-versions@v5
        with:
          owner: simpago
          package-name: ${{ matrix.ghcr_package }}
          package-type: container
          min-versions-to-keep: 20

      - name: Delete old sha-* tags from Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPO: ${{ matrix.dockerhub_repo }}
        run: |
          set -euo pipefail

          token=$(curl -fsS -X POST https://hub.docker.com/v2/users/login \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
            | jq -r .token)

          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "Failed to authenticate to Docker Hub"
            exit 1
          fi

          tags_json=$(curl -fsS -H "Authorization: JWT ${token}" \
            "https://hub.docker.com/v2/repositories/${REPO}/tags/?page_size=100")

          to_delete=$(echo "$tags_json" | jq -r '
            [.results[] | select(.name | startswith("sha-"))]
            | sort_by(.last_updated) | reverse
            | .[20:]
            | .[].name
          ')

          if [ -z "$to_delete" ]; then
            echo "Nothing to delete in ${REPO}"
            exit 0
          fi

          echo "$to_delete" | while read -r tag; do
            [ -z "$tag" ] && continue
            echo "Deleting ${REPO}:${tag}"
            curl -fsS -X DELETE -H "Authorization: JWT ${token}" \
              "https://hub.docker.com/v2/repositories/${REPO}/tags/${tag}/"
          done
