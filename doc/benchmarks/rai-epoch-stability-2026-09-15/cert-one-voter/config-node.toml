
[node]
    peering_port = 17075
    allow_local_peers = true
    bandwidth_limit = 0
    enable_voting = true
    preconfigured_peers = ["[::1]:17085","[::1]:17095","[::1]:17105","[::1]:17115","[::1]:17125",]
    preconfigured_representatives = ["nano_3e3j5tkog48pnny9dmfzj1r16pg8t1e76dz5tmac6iq689wyjfpiij4txtdo"]
    database_backend = "lmdb"
    cps_limit = 0
    epoch_length = 0
    epoch_terminated_elections = 25000


[node.lmdb]
    sync = "nosync_unsafe"

[node.network]
    max_peers_per_ip = 256

[node.message_processor]
    # default 64 per channel; nanospam sends bursts over few connections
    max_queue = 1024

[node.bounded_backlog]
    enable = false

[node.bootstrap_server]
    # default 500
    limiter = 500

[node.bootstrap]
    # default 500
    rate_limit = 500

    # default 16
    channel_limit = 64

[node.monitor]
    interval = 10

[node.websocket]
    enable = true
    address = "::"
    port = 17078

[rpc]
    enable = true

[node.vote_processor]
threads = 1
