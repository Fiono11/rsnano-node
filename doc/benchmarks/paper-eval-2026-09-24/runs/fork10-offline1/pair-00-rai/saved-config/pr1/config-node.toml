
[node]
    peering_port = 17085
    allow_local_peers = true
    bandwidth_limit = 0
    enable_voting = true
    # The whole voting weight: the quorum is the same on every PR and fixed
    # throughout the run, whichever representatives a PR has seen voting so far
    online_weight_minimum = "339282366920938463463374607431768211455"
    preconfigured_peers = ["[::1]:17075","[::1]:17095","[::1]:17105","[::1]:17115",]
    preconfigured_representatives = ["nano_3e3j5tkog48pnny9dmfzj1r16pg8t1e76dz5tmac6iq689wyjfpiij4txtdo"]
    database_backend = "lmdb"
    cps_limit = 0

[node.active_elections]
    epoch_terminated_elections = 0
    epoch_duration_ms = 8000
    account_voting = true
    checkpoint_finalization = "certificate_only"
    committee_model = "equal_weight"
    committee_f = 1
    committee_p = 1

[node.lmdb]
    sync = "nosync_unsafe"

[node.network]
    max_peers_per_ip = 256

[node.bounded_backlog]
    enable = false

[node.bootstrap_server]
    # default 500
    limiter = 500

[node.bootstrap]
    # default 500
    rate_limit = 500

    # default 16
    channel_limit = 64

[node.monitor]
    interval = 10

[node.websocket]
    enable = true
    address = "::"
    port = 17088

[rpc]
    enable = true
