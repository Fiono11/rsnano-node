
[node]
    peering_port = 17095
    allow_local_peers = true
    bandwidth_limit = 0
    enable_voting = true
    # The whole voting weight: the quorum is the same on every PR and fixed
    # throughout the run, whichever representatives a PR has seen voting so far
    online_weight_minimum = "339282366920938463463374607431768211455"
    preconfigured_peers = ["[::1]:17075","[::1]:17085","[::1]:17105","[::1]:17115","[::1]:17125",]
    preconfigured_representatives = ["nano_3e3j5tkog48pnny9dmfzj1r16pg8t1e76dz5tmac6iq689wyjfpiij4txtdo"]
    database_backend = "lmdb"
    cps_limit = 0
    vote_generator_delay = 100

[node.active_elections]
    # RAI keeps every unresolved fork instance as evidence until its owner
    # extends the position; a 10% fork workload leaves about 4,500 of them,
    # which the default cap of 5,000 would let starve new activations
    size = 20000
    epoch_duration_ms = 8000
    account_voting = true
    committee_model = "equal_weight"
    committee_f = 1
    committee_p = 1
    committee_drift = 100
    signed_vote_log = true
    signing_sync = "fsync"

[node.lmdb]
    sync = "nosync_unsafe"

[node.network]
    max_peers_per_ip = 256

[node.bounded_backlog]
    enable = false

[node.bootstrap_server]
    # default 500
    limiter = 500

[node.bootstrap]
    # default 500
    rate_limit = 500

    # default 16
    channel_limit = 64

[node.monitor]
    interval = 10

[node.websocket]
    enable = true
    address = "::"
    port = 17098

[rpc]
    enable = true
