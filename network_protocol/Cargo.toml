[package]
name = "rsnano_network_protocol"
version = "0.1.0"
edition = "2024"

[features]
ledger_snapshots = ["rsnano_messages/ledger_snapshots"]
rai_protocol = [
    "rsnano_types/rai_protocol",
    "rsnano_messages/rai_protocol",
    "rsnano_network/rai_protocol",
]

[dependencies]
rsnano_types = { path = "../types" }
rsnano_utils = { path = "../utils" }
rsnano_messages = { path = "../messages" }
rsnano_network = { path = "../network" }
anyhow = "1"
rand = { version = "0.10.1" }
tracing = "0"
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.18"
