[package]
name = "rsnano-insight"
version = "0.1.0"
edition = "2024"

[features]
ledger_snapshots = [
	"rsnano_node/ledger_snapshots",
	"rsnano_daemon/ledger_snapshots",
]
banano = [
	"rsnano_types/banano",
	"rsnano_store_lmdb/banano",
	"rsnano_ledger/banano",
	"rsnano_node/banano",
	"rsnano_daemon/banano",
]

[[bin]]
name = "rsnano-insight"
path = "src/main.rs"

[[bin]]
name = "rsban-insight"
path = "src/main.rs"
required-features = ["banano"]

[dependencies]
eframe = "0.33.3"
egui_extras = "0.33.3"
rsnano_nullable_clock = { path = "../../nullables/clock" }
rsnano_nullable_tracing_subscriber = { path = "../../nullables/tracing_subscriber" }
rsnano_types = { path = "../../types" }
rsnano_utils = { path = "../../utils" }
rsnano_messages = { path = "../../messages" }
rsnano_network = { path = "../../network" }
rsnano_store_lmdb = { path = "../../store_lmdb" }
rsnano_node = { path = "../../node" }
rsnano_daemon = { path = "../../daemon" }
rsnano_ledger = { path = "../../ledger" }
tokio = { version = "1", features = ["rt-multi-thread"] }
num-format = "0.4.4"
num = "0"
num-traits = "0"
num-derive = "0"
chrono = "0.4.43"
strum = "0"
tracing = "0"
serde_json = "1"
